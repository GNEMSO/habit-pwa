<title>Daily Habit Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column. Today's progress on top, one card per habit with its Monday-to-Sunday week as seven tap targets, then a 12-week grid per habit. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E8ECF3;
  --line: #D3DAE6;
  --ink: #141C2B;
  --muted: #586579;
  --accent: #F0A030;
  --on-accent: #2B1A00;
  --accent-text: #9A5A00;
  --focus: #2457C5;
  --danger: #B3261E;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131C;
    --surface: #151D29;
    --surface-2: #1F2A39;
    --line: #2B384A;
    --ink: #E7ECF4;
    --muted: #93A1B5;
    --accent: #F4B04E;
    --on-accent: #2B1A00;
    --accent-text: #F4B04E;
    --focus: #8FB2FF;
    --danger: #FF9A8F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131C;
  --surface: #151D29;
  --surface-2: #1F2A39;
  --line: #2B384A;
  --ink: #E7ECF4;
  --muted: #93A1B5;
  --accent: #F4B04E;
  --on-accent: #2B1A00;
  --accent-text: #F4B04E;
  --focus: #8FB2FF;
  --danger: #FF9A8F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
button, input { font-family: inherit; color: inherit; }

.app {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.top { display: flex; flex-direction: column; gap: 10px; }
.eyebrow {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 0;
  font: 700 30px/1.1 var(--font-display);
  text-wrap: balance;
}
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
.progress-text { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.habits { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-head > * { min-width: 0; }
h2 {
  margin: 0;
  font: 600 20px/1.2 var(--font-display);
  overflow-wrap: anywhere;
}
.streak { margin: 0; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; flex: none; }
.streak b {
  font: 700 26px/1 var(--font-display);
  color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.streak span { font-size: 12px; color: var(--muted); }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.dl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dl.now { color: var(--ink); font-weight: 600; }
.cell {
  width: 100%;
  max-width: 48px;
  aspect-ratio: 1;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.cell:active:not(:disabled) { transform: scale(0.94); }
.cell.today { border-color: var(--ink); }
.cell.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cell:disabled { background: transparent; border-style: dashed; cursor: default; opacity: 0.55; }
.cell:focus-visible, .tools button:focus-visible, .add button:focus-visible, .del:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.stats { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 18px; color: var(--muted); font-size: 13px; }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.rename {
  width: 100%;
  min-width: 0;
  font-size: 16px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
}
.rename:focus-visible, .add input:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.del {
  flex: none;
  min-height: 40px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--danger);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.del.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }

.history h2.sec { font-size: 18px; margin-bottom: 4px; }
.history .note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.hist-row { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
.hist-row + .hist-row { padding-top: 14px; border-top: 1px solid var(--line); }
.heat {
  display: grid;
  grid-template-rows: repeat(7, 16px);
  grid-auto-flow: column;
  grid-auto-columns: 16px;
  gap: 4px;
}
.heat i { border-radius: 3px; background: var(--surface-2); }
.heat i.on { background: var(--accent); }
.heat i.f { background: transparent; }
.hist-label { min-width: 0; }
.hist-label p { margin: 0; }
.hist-label .n { font: 600 16px/1.3 var(--font-display); overflow-wrap: anywhere; }
.hist-label .c { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tools button, .add button {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.add { display: flex; gap: 8px; }
.add input {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  padding: 0 12px;
  font-size: 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.add button { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.status { margin: 0; font-size: 12px; color: var(--muted); min-height: 1.3em; }
.empty p { margin: 0; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .bar span, .cell { transition: none; }
  .cell:active:not(:disabled) { transform: none; }
}
</style>

<main class="app">
  <header class="top">
    <p class="eyebrow">Today</p>
    <h1 id="dateLabel">Daily Habit Log</h1>
    <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
    <p class="progress-text" id="progressText" role="status"></p>
  </header>

  <section class="habits" id="habits" aria-label="Habits"></section>

  <section class="history" id="historySection" aria-label="History">
    <h2 class="sec">Last 12 weeks</h2>
    <p class="note">Each column is a week, Monday at the top. The right-hand column is this week.</p>
    <div class="card" id="history"></div>
  </section>

  <div class="tools">
    <button type="button" id="editBtn" aria-pressed="false">Edit habits</button>
  </div>
  <form class="add" id="addForm" hidden>
    <label class="sr" for="newHabit">New habit name</label>
    <input id="newHabit" type="text" maxlength="40" placeholder="e.g. Read for 20 minutes" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <p class="status" id="status" role="status">Checking for saved data</p>
</main>

<script>
(function () {
  'use strict';

  var LS_KEY = 'daily-habit-log:v1';
  var DAY_MS = 86400000;
  var MAX_HABITS = 20;

  var dateEl = document.getElementById('dateLabel');
  var barFill = document.getElementById('barFill');
  var progressEl = document.getElementById('progressText');
  var habitsEl = document.getElementById('habits');
  var historySection = document.getElementById('historySection');
  var historyEl = document.getElementById('history');
  var editBtn = document.getElementById('editBtn');
  var addForm = document.getElementById('addForm');
  var newInput = document.getElementById('newHabit');
  var statusEl = document.getElementById('status');

  var CHECK = '<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4.5 10.5l3.6 3.6 7.4-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ---------- dates (local time, weeks start Monday) ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function dayNum(k) { var p = k.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY_MS); }

  /* ---------- state ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function defaults() {
    return {
      v: 1,
      habits: [{ id: 'h-exercise', name: 'Exercise' }, { id: 'h-wake', name: 'Wake up early' }],
      log: {},
      updatedAt: 0
    };
  }
  function normalize(o) {
    var habits = [];
    var log = {};
    if (o && Array.isArray(o.habits)) {
      o.habits.forEach(function (h) {
        if (h && typeof h.id === 'string' && typeof h.name === 'string') {
          habits.push({ id: h.id.slice(0, 40), name: h.name.slice(0, 60) });
        }
      });
    }
    if (o && o.log && typeof o.log === 'object') {
      Object.keys(o.log).forEach(function (k) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(o.log[k])) {
          var a = o.log[k].filter(function (x) { return typeof x === 'string'; });
          if (a.length) log[k] = a;
        }
      });
    }
    return { v: 1, habits: habits, log: log, updatedAt: (o && +o.updatedAt) || 0 };
  }
  function loadLocal() {
    try {
      var s = localStorage.getItem(LS_KEY);
      if (s) {
        var o = JSON.parse(s);
        if (o && Array.isArray(o.habits)) return normalize(o);
      }
    } catch (e) { /* storage unavailable */ }
    return defaults();
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  var state = loadLocal();
  var editing = false;
  var pendingDelete = null;
  var lastFocus = null;
  var lastDay = '';

  function isDone(id, k) {
    var a = state.log[k];
    return !!a && a.indexOf(id) > -1;
  }
  function streak(id) {
    var d = today();
    if (!isDone(id, key(d))) d = addDays(d, -1);
    var n = 0;
    while (isDone(id, key(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function bestStreak(id) {
    var nums = Object.keys(state.log)
      .filter(function (k) { return state.log[k].indexOf(id) > -1; })
      .map(dayNum)
      .sort(function (a, b) { return a - b; });
    var best = 0, run = 0, prev = null;
    nums.forEach(function (n) {
      run = (prev !== null && n === prev + 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = n;
    });
    return best;
  }
  function doneInLast(id, days) {
    var t = today(), c = 0;
    for (var i = 0; i < days; i++) if (isDone(id, key(addDays(t, -i)))) c++;
    return c;
  }

  /* ---------- rendering ---------- */
  function cardHtml(h) {
    var t = today();
    var wk = mondayOf(t);
    var tk = key(t);
    var cells = '';
    for (var i = 0; i < 7; i++) {
      var d = addDays(wk, i);
      var k = key(d);
      var future = d > t;
      var done = isDone(h.id, k);
      var isToday = k === tk;
      var full = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
      cells += '<div class="day">' +
        '<span class="dl' + (isToday ? ' now' : '') + '">' + esc(d.toLocaleDateString(undefined, { weekday: 'narrow' })) + '</span>' +
        '<button type="button" class="cell' + (done ? ' done' : '') + (isToday ? ' today' : '') + '"' +
        ' data-habit="' + esc(h.id) + '" data-day="' + k + '" aria-pressed="' + done + '"' +
        ' aria-label="' + esc(h.name + ', ' + full) + '"' + (future ? ' disabled' : '') + '>' +
        (done ? CHECK : '<span>' + d.getDate() + '</span>') + '</button></div>';
    }
    var s = streak(h.id);
    var head;
    if (editing) {
      var armed = pendingDelete === h.id;
      head = '<div class="card-head">' +
        '<input class="rename" id="rename-' + esc(h.id) + '" data-rename="' + esc(h.id) + '" type="text" maxlength="40" value="' + esc(h.name) + '" aria-label="Habit name">' +
        '<button type="button" class="del' + (armed ? ' armed' : '') + '" data-del="' + esc(h.id) + '">' + (armed ? 'Tap again to delete' : 'Delete') + '</button></div>';
    } else {
      head = '<div class="card-head"><h2>' + esc(h.name) + '</h2>' +
        '<p class="streak"><b>' + s + '</b><span>day streak</span></p></div>';
    }
    return '<article class="card">' + head +
      '<div class="week">' + cells + '</div>' +
      '<p class="stats"><span>Best streak <b>' + bestStreak(h.id) + '</b></span>' +
      '<span>Last 30 days <b>' + doneInLast(h.id, 30) + '</b>/30</span></p></article>';
  }

  function historyHtml() {
    var t = today();
    var start = addDays(mondayOf(t), -77);
    return state.habits.map(function (h) {
      var cells = '', done = 0, total = 0;
      for (var w = 0; w < 12; w++) {
        for (var r = 0; r < 7; r++) {
          var d = addDays(start, w * 7 + r);
          if (d > t) { cells += '<i class="f"></i>'; continue; }
          total++;
          if (isDone(h.id, key(d))) { done++; cells += '<i class="on"></i>'; } else { cells += '<i></i>'; }
        }
      }
      return '<div class="hist-row">' +
        '<div class="heat" role="img" aria-label="' + esc(h.name + ': ' + done + ' of ' + total + ' days done in the last 12 weeks') + '">' + cells + '</div>' +
        '<div class="hist-label"><p class="n">' + esc(h.name) + '</p><p class="c">' + done + ' of ' + total + ' days</p></div></div>';
    }).join('');
  }

  function render() {
    var t = today();
    var tk = key(t);
    lastDay = tk;
    dateEl.textContent = t.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

    var n = state.habits.length, done = 0;
    state.habits.forEach(function (h) { if (isDone(h.id, tk)) done++; });
    barFill.style.width = (n ? Math.round(done / n * 100) : 0) + '%';
    progressEl.textContent = n === 0 ? 'No habits yet' : (done === n ? 'All ' + n + ' done today' : done + ' of ' + n + ' done today');

    habitsEl.innerHTML = n
      ? state.habits.map(cardHtml).join('')
      : '<div class="card empty"><p>No habits yet. Choose Edit habits to add your first one.</p></div>';
    historySection.hidden = n === 0;
    historyEl.innerHTML = n ? historyHtml() : '';

    editBtn.textContent = editing ? 'Done editing' : 'Edit habits';
    editBtn.setAttribute('aria-pressed', editing ? 'true' : 'false');
    addForm.hidden = !editing;

    if (lastFocus) {
      var esc2 = (window.CSS && CSS.escape) ? CSS.escape : function (x) { return x; };
      var el = document.querySelector('[data-habit="' + esc2(lastFocus[0]) + '"][data-day="' + lastFocus[1] + '"]');
      if (el && !el.disabled) el.focus({ preventScroll: true });
      lastFocus = null;
    }
  }

  function setStatus(msg) { statusEl.textContent = msg; }

  /* ---------- changes ---------- */
  var remote = null;   // { ref, ready }
  var dirty = false, writing = false, timer = null, retried = false;

  function changed() {
    state.updatedAt = Date.now();
    saveLocal();
    render();
    if (remote) {
      setStatus('Saving');
      dirty = true;
      clearTimeout(timer);
      timer = setTimeout(flush, 500);
    } else {
      setStatus('Saved on this device only');
    }
  }

  function flush() {
    if (!remote || !remote.ready || writing || !dirty) return;
    writing = true;
    dirty = false;
    var copy = JSON.parse(JSON.stringify(state));
    remote.ref.set(copy).then(function () {
      writing = false;
      retried = false;
      if (dirty) flush(); else setStatus('Saved');
    }).catch(function (err) {
      writing = false;
      dirty = true;
      if (err && err.code === 'unavailable' && !retried) {
        retried = true;
        clearTimeout(timer);
        timer = setTimeout(flush, 1500 + Math.random() * 1000);
        setStatus('Retrying');
      } else {
        setStatus('Could not reach your account. Changes are kept on this device.');
      }
    });
  }

  function toggle(id, k) {
    var a = (state.log[k] || []).slice();
    var i = a.indexOf(id);
    if (i > -1) a.splice(i, 1); else a.push(id);
    if (a.length) state.log[k] = a; else delete state.log[k];
    changed();
  }
  function removeHabit(id) {
    state.habits = state.habits.filter(function (h) { return h.id !== id; });
    Object.keys(state.log).forEach(function (k) {
      var a = state.log[k].filter(function (x) { return x !== id; });
      if (a.length) state.log[k] = a; else delete state.log[k];
    });
    changed();
  }
  function newId() { return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!(t instanceof Element)) return;
    var cell = t.closest('[data-day]');
    if (cell) {
      if (cell.disabled) return;
      pendingDelete = null;
      lastFocus = [cell.getAttribute('data-habit'), cell.getAttribute('data-day')];
      toggle(lastFocus[0], lastFocus[1]);
      return;
    }
    var del = t.closest('[data-del]');
    if (del) {
      var id = del.getAttribute('data-del');
      if (pendingDelete === id) { pendingDelete = null; removeHabit(id); }
      else { pendingDelete = id; render(); }
      return;
    }
    if (t.closest('#editBtn')) {
      editing = !editing;
      pendingDelete = null;
      render();
      return;
    }
    if (pendingDelete) { pendingDelete = null; render(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (!(t instanceof Element)) return;
    var inp = t.closest('[data-rename]');
    if (!inp) return;
    var id = inp.getAttribute('data-rename');
    var name = inp.value.trim().slice(0, 40);
    var h = state.habits.filter(function (x) { return x.id === id; })[0];
    if (!h) return;
    if (!name || name === h.name) { render(); return; }
    h.name = name;
    changed();
  });

  addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = newInput.value.trim().slice(0, 40);
    if (!name) return;
    if (state.habits.length >= MAX_HABITS) { setStatus('You can track up to ' + MAX_HABITS + ' habits.'); return; }
    state.habits.push({ id: newId(), name: name });
    newInput.value = '';
    changed();
    newInput.focus();
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && key(today()) !== lastDay) render();
  });
  setInterval(function () { if (key(today()) !== lastDay) render(); }, 30000);

  /* ---------- account sync (falls back to this device) ---------- */
  function mergeLog(d) {
    var ids = {};
    d.habits.forEach(function (h) { ids[h.id] = 1; });
    Object.keys(state.log).forEach(function (k) {
      var cur = d.log[k] ? d.log[k].slice() : [];
      state.log[k].forEach(function (id) { if (ids[id] && cur.indexOf(id) < 0) cur.push(id); });
      if (cur.length) d.log[k] = cur;
    });
  }

  function onRemote(snap) {
    if (!remote) return;
    var definitive = !snap.metadata.fromCache;
    var d;
    if (!remote.ready) {
      if (!definitive) return;
      remote.ready = true;
      if (snap.exists) {
        d = normalize(snap.data());
        if (state.updatedAt > 0 && d.updatedAt < state.updatedAt) {
          mergeLog(d);
          d.updatedAt = Date.now();
          state = d;
          saveLocal();
          render();
          dirty = true;
          flush();
        } else {
          state = d;
          dirty = false;
          saveLocal();
          render();
          setStatus('Saved');
        }
      } else if (state.updatedAt > 0) {
        dirty = true;
        flush();
      } else {
        setStatus('Saved');
      }
      return;
    }
    if (!snap.exists || dirty || writing || snap.metadata.hasPendingWrites) return;
    d = normalize(snap.data());
    if (d.updatedAt === state.updatedAt) return;
    state = d;
    saveLocal();
    render();
  }

  function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { setStatus('Saved on this device only'); return; }
    Promise.all([c.use('db'), c.use('user')]).then(function (r) {
      if (!r[0] || !r[1]) return null;
      return r[1].id().then(function (uid) {
        return uid ? r[0].doc('data/users/' + uid + '/tracker') : null;
      });
    }).then(function (ref) {
      if (!ref) { setStatus('Saved on this device only'); return; }
      remote = { ref: ref, ready: false };
      var slow = setTimeout(function () {
        setStatus("Can't reach your saved data yet. Showing this device's copy.");
      }, 10000);
      ref.onSnapshot(function (snap) {
        if (!snap.metadata.fromCache) clearTimeout(slow);
        onRemote(snap);
      }, function () {
        clearTimeout(slow);
        remote = null;
        setStatus('Saved on this device only');
      });
    }).catch(function () { setStatus('Saved on this device only'); });
  }

  render();
  connect();
})();
</script>
